syntax = "proto3";

package linkSync;

service linksServices {
  rpc chkUpdates (SyncRequest) returns (SyncRequestResponse){}
  rpc fetchUpdates (SyncRequest) returns (stream linkItems){}
};

message SyncRequest {
  int64 last_sync = 1
};

message SyncRequestResponse {
  bool is_update = 1
  int64 server_lastes_update = 2
};

message linkItems {
  string name = 1
  string desc = 2
  string url = 3
  repeat string tags = 4
};