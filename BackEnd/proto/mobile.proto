syntax = "proto3";

package api;

service UsuarioService {
  rpc BuscarUsuario (UsuarioRequest) returns (UsuarioResponse);
}

message UsuarioRequest {
  int32 id = 1;
}

message UsuarioResponse {
  int32 id = 1;
  string nome = 2;
  string email = 3;
}

service ServicoDeServicos {
  rpc BuscarServico (BuscaServicoRequest) returns (ServicoResponse);
  rpc ListarComprasDoUsuario (ComprasRequest) returns (ComprasResponse);
}

message BuscaServicoRequest {
  string pesquisa = 1; 
}

message ServicoResponse {
  string id = 1;
  string nomeDoServico = 2;
  string descricao = 3;
}

message ComprasRequest {
  int32 usuarioId = 1;
}

message ComprasResponse {
  repeated string listaDeCompras = 1; 
}