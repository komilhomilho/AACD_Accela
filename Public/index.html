
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accela</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS das páginas -->
    <link rel="stylesheet" href="./assets/styles/faq.css">
    <link rel="stylesheet" href="./assets/styles/login.css">
    <link rel="stylesheet" href="./assets/styles/redirect.css">
    <link rel="stylesheet" href="./assets/styles/favorites.css">
    <link rel="stylesheet" href="./assets/styles/global_search.css">
    <link rel="stylesheet" href="./assets/styles/home.css">
    <link rel="stylesheet" href="./assets/styles/sign_up.css">
    <link rel="stylesheet" href="./assets/styles/specify_category.css">
    <link rel="stylesheet" href="./assets/styles/global.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- Conteúdo principal da SPA -->
    <main id="app" class="container-fluid"></main>

    <!-- Navbar inferior -->
    <nav aria-label="Navegação principal">
        <ul class="nav nav-pills bottom-nav">

            <!-- HOME -->
            <li class="nav-item">
                <button
                    class="nav-link active"
                    type="button"
                    data-page="home"
                    aria-label="Início"
                    aria-current="page">
                    <i class="bi bi-house-fill"></i>
                </button>
            </li>

            <!-- FAVORITOS -->
            <li class="nav-item">
                <button
                    class="nav-link"
                    type="button"
                    data-page="favorites"
                    aria-label="Favoritos">
                    <i class="bi bi-star"></i>
                </button>
            </li>

            <!-- FAQ -->
            <li class="nav-item">
                <button
                    class="nav-link"
                    type="button"
                    data-page="faq"
                    aria-label="Ajuda">
                    <i class="bi bi-headset"></i>
                </button>
            </li>

            <!-- PERFIL -->
            <li class="nav-item">
                <button
                    class="nav-link"
                    type="button"
                    data-page="login"
                    aria-label="Perfil">
                    <i class="bi bi-person"></i>
                </button>
            </li>

        </ul>
    </nav>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Navegação SPA -->
    <script type="module">
        import { switchPage } from './Pages/app.js';

        // Botões da navbar
        const botoes = document.querySelectorAll(
            '.bottom-nav .nav-link'
        );

        // Categorias da Home
        const categorias = {
            "Governo e documentos": "gov_doc",
            "Trânsito": "transit",
            "Saúde": "health",
            "Benefícios e dinheiro": "benefits"
        };

        // Atualiza o botão ativo
        function atualizarNavbar(pagina) {
            botoes.forEach(botao => {
                const ativo = botao.dataset.page === pagina;

                botao.classList.toggle('active', ativo);

                if (ativo) {
                    botao.setAttribute('aria-current', 'page');
                } else {
                    botao.removeAttribute('aria-current');
                }
            });
        }

        // Detecta cliques na página
        document.addEventListener('click', async (evento) => {

            // Navegação pela navbar
            const botao = evento.target.closest(
                '.bottom-nav [data-page]'
            );

            if (botao) {
                const pagina = botao.dataset.page;

                await switchPage(pagina);
                atualizarNavbar(pagina);

                return;
            }

            // Navegação pelas categorias da Home
            const card = evento.target.closest('.home-card');

            if (card) {

                // Evita navegar novamente se outro
                // evento já substituiu a Home
                if (!card.isConnected) return;

                const nome = card.querySelector('span')
                    ?.textContent.trim();

                const pagina = categorias[nome];

                if (pagina) {
                    evento.preventDefault();
                    evento.stopImmediatePropagation();

                    await switchPage(pagina);

                    // Categorias pertencem à Home
                    atualizarNavbar('home');
                }
            }
        });
    </script>

</body>
</html>
