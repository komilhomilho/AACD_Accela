<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accela</title>
    <link rel="shortcut icon" href="./logo.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/src/assets/css/redirect.css">
    <link rel="stylesheet" href="/src/assets/css/global_search.css">
    <link rel="stylesheet" href="/src/assets/css/home.css">
    <link rel="stylesheet" href="/src/assets/css/specify_category.css">
    <link rel="stylesheet" href="/src/assets/css/global.css">
    <link rel="stylesheet" href="/src/assets/css/faq.css">
    <link rel="stylesheet" href="/src/assets/css/welcome.css">



    <script type="module" src="/src/components/app.js"></script>
    <script type="module" src="./index.js"></script>
</head>

<body class="min-vh-100  bg-white">
    <div class="d-flex justify-content-center align-items-center my-7">
        <button id="logo-home" type="button" class="border-0 bg-transparent p-0"
            aria-label="Voltar para a página inicial">
            <img id="logo-img" src="/src/assets/img/logo_texto_preto.svg" class="w-12" alt="Accela">
        </button>
    </div>

    <main id="app" class="container-fluid bg-white fg-black""></main>

    <nav aria-label=" Navegação principal">
        <ul class="nav nav-pills bottom-nav">
            <li class="nav-item">
                <button class="nav-link active" type="button" data-page="home" aria-current="page">
                    <span class="texto-acessivel">Página Inicial</span>
                    <i class="bi bi-house-fill" aria-hidden="true"></i>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" data-page="faq">
                    <span class="texto-acessivel">Central de Ajuda e Dúvidas</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2">
                            <path stroke-linejoin="round"
                                d="M14 19c3.771 0 5.657 0 6.828-1.172S22 14.771 22 11s0-5.657-1.172-6.828S17.771 3 14 3h-4C6.229 3 4.343 3 3.172 4.172S2 7.229 2 11s0 5.657 1.172 6.828c.653.654 1.528.943 2.828 1.07" />
                            <path
                                d="M10 8.484C10.5 7.494 11 7 12 7c1.246 0 2 .989 2 1.978s-.5 1.033-2 2.022v1m0 2.5v.5m2 4c-1.236 0-2.598.5-3.841 1.145c-1.998 1.037-2.997 1.556-3.489 1.225s-.399-1.355-.212-3.404L6.5 17.5" />
                        </g>
                    </svg>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" data-page="history">
                    <span class="texto-acessivel">Histórico de Perfil</span>
                    <i class="bi bi-clock-history" aria-hidden="true"></i>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" data-page="favorites">
                    <span class="texto-acessivel">Favoritos</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"
                            d="M11.074 2.633c.32-.844 1.531-.844 1.852 0l2.07 5.734a.99.99 0 0 0 .926.633h5.087c.94 0 1.35 1.17.611 1.743L18 14a.97.97 0 0 0-.322 1.092L19 20.695c.322.9-.72 1.673-1.508 1.119l-4.917-3.12a1 1 0 0 0-1.15 0l-4.917 3.12c-.787.554-1.83-.22-1.508-1.119l1.322-5.603A.97.97 0 0 0 6 14l-3.62-3.257C1.64 10.17 2.052 9 2.99 9h5.087a.99.99 0 0 0 .926-.633z" />
                    </svg>
                </button>
            </li>
        </ul>
        </nav>

        <div id="accesibility">
            <i class="bi bi-universal-access toggle-icon"></i>

            <div class="acessibility-menu">
                <h6 class="text-white fw-bold mb-3 text-center w-100">Acessibilidade</h6>

                <button class="btn-acesso w-100 mb-2" id="vlibras-button">
                    <img src="https://vlibras.gov.br/app/assets/images/vlibras-access.svg" alt="" class="fs-5"
                        aria-hidden="true">
                    <span>Tradutor de Libras</span>
                </button>

                <div class="d-flex gap-2 mb-3">
                    <button class="btn-acesso flex-fill" id="btn-fonte-aumentar">
                        <i class="bi bi-zoom-in"></i> A+
                    </button>
                    <button class="btn-acesso flex-fill" id="btn-fonte-diminuir">
                        <i class="bi bi-zoom-out"></i> A-
                    </button>
                </div>

                <div class="acesso-toggle-container w-100 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2 text-white">
                        <i class="bi bi-moon-fill fs-5"></i>
                        <span class="fw-bold">Modo Escuro</span>
                    </div>
                    <label class="custom-switch">
                        <input type="checkbox" id="switch-contraste">
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <div vw class="enabled">
            <div vw-access-button class="active"></div>
            <div vw-plugin-wrapper>
                <div class="vw-plugin-top-wrapper"></div>
            </div>
        </div>

        <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>

</html>
