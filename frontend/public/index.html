<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accela</title>
    <link rel="shortcut icon" href="./logo.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="/src/assets/css/redirect.css">
    <link rel="stylesheet" href="/src/assets/css/global_search.css">
    <link rel="stylesheet" href="/src/assets/css/home.css">
    <link rel="stylesheet" href="/src/assets/css/specify_category.css">
    <link rel="stylesheet" href="/src/assets/css/global.css">
    <link rel="stylesheet" href="/src/assets/css/faq.css">

    <script type="module" src="/src/components/app.js"></script>
    <script type="module" src="./index.js"></script>
</head>

<body class="min-vh-100 bg-inverse">
    <div class="d-flex justify-content-center align-items-center">
        <img src="../src/assets/img/vetorizador_de_imagens_por_ia_gratuito_cf0loowxjk02o19lldy3.svg" class="w-12">
    </div>

    <main id="app" class="container-fluid bg-inverse"></main>

    <nav aria-label="Navegação principal">
        <ul class="nav nav-pills bottom-nav">
            <li class="nav-item">
                <button class="nav-link active" type="button" data-page="home">
                    <span class="visually-hidden">Página Inicial</span> 
                    <i class="bi bi-house-fill" aria-hidden="true"></i>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" data-page="faq">
                    <span class="visually-hidden">Central de Ajuda e Dúvidas</span>
                    <i class="bi bi-headset" aria-hidden="true"></i>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" data-page="history">
                    <span class="visually-hidden">Histórico de Perfil</span>
                    <i class="bi bi-clock-history" aria-hidden="true"></i>
                </button>
            </li>
        </ul>
    </nav>

    <div id="accesibility">
        <i class="bi bi-universal-access toggle-icon"></i>

        <div class="acessibility-menu">
            <h6 class="text-white fw-bold mb-3 text-center w-100">Acessibilidade</h6>

            <button class="btn-acesso w-100 mb-2" id="vlibras-button">
                <img src="https://vlibras.gov.br/app/assets/images/vlibras-access.svg" alt="" class="fs-5" aria-hidden="true">
                <span>Tradutor de Libras</span>
            </button>

            <div class="d-flex gap-2 mb-3">
                <button class="btn-acesso flex-fill" id="btn-fonte-aumentar">
                    <i class="bi bi-zoom-in"></i> A+
                </button>
                <button class="btn-acesso flex-fill" id="btn-fonte-diminuir">
                    <i class="bi bi-zoom-out"></i> A-
                </button>
            </div>

            <div class="acesso-toggle-container w-100 d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2 text-white">
                    <i class="bi bi-circle-half fs-5"></i>
                    <span class="fw-bold">Alto Contraste</span>
                </div>
                <label class="custom-switch">
                    <input type="checkbox" id="switch-contraste">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>

</html>
